name: secretcheck
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: hash
        env:
          S: ${{ secrets.TS_OAUTH_SECRET }}
          I: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        run: |
          echo "len_secret=${#S}"
          echo "sha_secret=$(printf '%s' "$S" | sha256sum | cut -c1-16)"
          echo "len_id=${#I}"
          echo "sha_id=$(printf '%s' "$I" | sha256sum | cut -c1-16)"
